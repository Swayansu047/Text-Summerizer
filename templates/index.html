<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
     <link rel="stylesheet" href="{{url_for('static', filename='style.css')}}">
</head>
<body>
    <h1>Text Summarizer</h1>
    <form method="POST">
        <textarea name="text" placeholder="paste your text"></textarea>
        <br>
        <button type="submit">Summarize</button>
    </form>
    <h2>summary</h2>
    <p id="summaryText">{{ summary }}</p>

<small onclick="copyText()" style="cursor:pointer; color:blue;"></small>

<div class="icon-box">
    <i id="copyBtn" class="fa-solid fa-copy" onclick="copyText()"></i>
    <i id="shareBtn" class="fa-solid fa-share" onclick="shareText()"></i>
</div>


<script>
function copyText() {
    let text = document.getElementById("summaryText").innerText;
    navigator.clipboard.writeText(text);
}


function shareText() {
    let text = document.getElementById("summaryText").innerText;

    if (navigator.share) {
        navigator.share({
            title: "Text Summary",
            text: text
        });
    } else {
        alert("Sharing not supported on this browser");
    }
}
</script>
    
</body>
</html>
