<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Summarizer</title>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<h1>Text Summarizer</h1>

<form method="POST" enctype="multipart/form-data">

    <div class="textarea-container">

        <textarea name="text" placeholder="Paste your text here..."></textarea>

        <label class="file-btn">
            <i class="fa-solid fa-link"></i>
            <input type="file" name="pdf" accept=".pdf" onchange="showFileName(this)">
        </label>

    </div>

    <p id="fileName">
        <i class="fa-solid fa-paperclip"></i>
        <span id="fileText"></span>
    </p>

    <button id="actionBtn" type="submit">Summarize</button>

</form>

<h2>Summary</h2>

{% if stats %}
<div class="stats-box">
    <div class="stat">
        <span class="stat-value">{{ stats.original }}</span>
        <span class="stat-label">Original Words</span>
    </div>
    <div class="stat-arrow">→</div>
    <div class="stat">
        <span class="stat-value">{{ stats.summary }}</span>
        <span class="stat-label">Summary Words</span>
    </div>
    <div class="stat-pill">
        ↓ {{ stats.reduction }}% shorter
    </div>
</div>
{% endif %}

<p id="summaryText">{{ summary }}</p>

<div class="icon-box">
    <i id="copyBtn" class="fa-solid fa-copy" onclick="copyText()"></i>
    <i id="shareBtn" class="fa-solid fa-share" onclick="shareText()"></i>
</div>

<script>

function copyText() {
    let text = document.getElementById("summaryText").innerText;
    navigator.clipboard.writeText(text);
}

function shareText() {
    let text = document.getElementById("summaryText").innerText;

    if (navigator.share) {
        navigator.share({
            title: "Text Summary",
            text: text
        });
    } else {
        alert("Sharing not supported on this browser");
    }
}

function showFileName(input) {
    const fileName = document.getElementById("fileName");
    const fileText = document.getElementById("fileText");

    if (input.files.length > 0) {
        fileText.innerText = "Attached: " + input.files[0].name;
        fileName.classList.add("show");
    }

}

document.addEventListener("DOMContentLoaded", function() {

    const summary = document.getElementById("summaryText").innerText.trim();
    const btn = document.getElementById("actionBtn");

    if (summary !== "") {
        btn.innerText = "Clear";
        btn.type = "button";

        btn.onclick = function() {
            window.location.href = "/";
        };
    }

});

</script>

</body>
</html>
